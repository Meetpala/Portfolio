name: My First CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Build Application
        run: |
          echo "Building application..."
          # Add your build commands here
          # npm install && npm run build
          # or python setup.py build
      
      - name: Run Tests
        run: |
          echo "Running tests..."
          # Add your test commands here
          # npm test
          # or pytest tests/
      
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p $EC2_PORT $EC2_USER@$EC2_HOST 'cd /var/www/portfolio && git pull origin main && ./deploy.sh'